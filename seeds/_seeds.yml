version: 2
seeds:
  - name: mini_module_map
    description: >
      Canonical lesson (mini-module) list per module, provided by the curriculum team.
      Maps raw flow titles to canonical lesson names. PPH + APH complete; COMMS/RMC WIP.
    columns:
      - name: mini_module
        data_tests: [not_null, unique]
  - name: excluded_contacts
    description: >
      Manual exclusion list — contact_ids to filter out beyond the rule-based flags
      (SYSTEM_TESTER / blocked / opted-out). Unioned into int_contact_profile.is_excluded.
    config:
      column_types:
        contact_id: String
    columns:
      - name: contact_id
        data_tests: [not_null]
