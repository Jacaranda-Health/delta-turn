version: 2

models:
  - name: int_message_events
    description: One row per message with normalized direction and user key.
    columns:
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ['inbound', 'outbound']
      - name: event_ts
        description: >
          Parsed message timestamp. Should never be null — a null means the upstream
          epoch field changed type (e.g. String -> Decimal) and the parse silently failed.
        data_tests:
          - not_null
      - name: user_key
        description: Normalized phone/wa_id shared across inbound and outbound.
  - name: int_module_responses
    description: Flow responses classified into the 4 canonical DELTA modules.
    columns:
      - name: id
        description: Surrogate key of (package_id, response_row_id) — same grain as int_flow_responses.
        data_tests:
          - not_null
          - unique
      - name: module_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PPH', 'Communication', 'RMC', 'APH']
  - name: int_flow_responses
    description: Unnested Flow Results — one row per answered question.
    columns:
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique
  - name: int_message_status
    description: Furthest delivery status per message id.
    columns:
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique
  - name: int_delta_sessions
    description: >
      Response latency per inbound user trigger via ASOF join to the first outbound
      reply at/after the trigger. Grain: one row per inbound message_id.
    columns:
      - name: id
        description: Surrogate key of inbound message_id (unique per trigger).
        data_tests:
          - not_null
          - unique
  - name: int_lesson_completion
    description: >
      Lesson completion status per contact and module by day.
    columns:
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique
      - name: contact_id
        data_tests: [not_null]
      - name: module_name
  - name: int_contact_profile
    description: >
      RESTRICTED — CONTAINS PII (phone + names). One row per contact with profile
      attributes unnested from Turn's details JSON. The only model holding direct
      identifiers; Power BI reads dim_learner instead. Restrict grants on this schema.
    columns:
      - name: contact_id
        description: Turn numeric contact id (matches the flow-response contact_id).
        data_tests:
          - not_null
          - unique
      - name: is_excluded
        description: True for test cadre (SYSTEM_TESTER), blocked, opted-out, or seed-listed contacts.
