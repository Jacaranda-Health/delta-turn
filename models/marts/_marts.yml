version: 2

models:
  - name: mart_delta_kpis_daily
    description: Daily DELTA KPIs for Power BI (enrolled, success, downtime, latency).
    columns:
      - name: day
        data_tests: [not_null, unique]
  - name: mart_module_completion_daily
    description: Daily module completion funnel per canonical module.
    columns:
      - name: module_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['PPH', 'Communication', 'RMC', 'Climate & Health']