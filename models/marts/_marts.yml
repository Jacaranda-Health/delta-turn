version: 2

models:
  - name: delta_kpis_daily
    description: Daily DELTA KPIs for Power BI (enrolled, success, downtime, latency).
    columns:
      - name: day
        data_tests: [not_null, unique]
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique
  - name: module_completion_daily
    description: >
      Daily module completion per canonical module. Reports posttest_completion_rate
      (headline — finished the module's post-test) and completion_rate (strict — all
      active lessons). Roll-up of module_completion.
    columns:
      - name: module_name
        data_tests: [not_null]
      - name: day
        data_tests: [not_null]
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique

  - name: mini_module_completion_daily
    description: >
      Daily lesson (mini-module) completion per canonical lesson. Lesson completion =
      answered all of that lesson's questions. Canonical names from mini_module_map.
    columns:
      - name: module_name
        data_tests: [not_null]
      - name: mini_module
        data_tests: [not_null]
      - name: day
        data_tests: [not_null]
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique

  - name: session_latency
    description: >
      Session-grain latency (one row per replied trigger, no user identifiers).
      Exists so Power BI can compute a true MEDIAN/percentile over any selected
      period — averaging daily medians is not statistically valid.
    columns:
      - name: day
        description: Date of the inbound trigger.
        data_tests: [not_null]
      - name: latency_seconds
        description: Seconds from user trigger to DELTA's first reply, bounded by max_reply_window_seconds.
        data_tests: [not_null]
      - name: id
        description: Surrogate key of (day, latency_seconds).
        data_tests:
          - not_null
          - unique
  - name: module_progression_daily
    description: >
      Distribution of contacts by number of lessons completed within a module.
    columns:
      - name: module_name
        data_tests: [not_null]
      - name: lessons_completed
        data_tests: [not_null]
      - name: id
        description: Surrogate key of (module_name, lessons_completed).
        data_tests:
          - not_null
          - unique
  - name: learner_module_progress
    description: >
      BI-ready per-learner module progress (lessons started vs completed). Relate to
      learners (contact_id) and modules (module_name) for cadre / facility /
      county slicing. Grain: one row per (module, contact).
    columns:
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique
      - name: contact_id
        data_tests: [not_null]
      - name: module_name
        data_tests: [not_null]
  - name: enrollments
    description: >
      Contact-grain enrolment fact (one row per learner, first-activity day). Relate
      contact_id -> learners and enroll_day -> dates so Total Users can be
      filtered by cadre / county / facility.
    columns:
      - name: id
        description: Surrogate key over contact_id.
        data_tests:
          - not_null
          - unique
      - name: contact_id
        data_tests: [not_null, unique]
      - name: enroll_day
        data_tests: [not_null]
  - name: daily_messages
    description: >
      Per-learner daily message counts (outbound/inbound). Contact-grain so cadre /
      facility / county slicers via learners can filter message volume. Relate
      contact_id -> learners, day -> dates. contact_id null = unattributed.
    columns:
      - name: id
        description: Surrogate key over (contact_id, day).
        data_tests:
          - not_null
          - unique
      - name: day
        data_tests: [not_null]
  - name: learner_lesson_completion
    description: >
      Per-learner lesson completion (one row per module/lesson/contact). Contact-grain
      so the Lesson Completion table can be sliced by cadre / facility / county via
      learners. Relate contact_id -> learners, module_name -> modules.
    columns:
      - name: id
        description: Surrogate key over (module, lesson, contact).
        data_tests:
          - not_null
          - unique
      - name: contact_id
        data_tests: [not_null]
      - name: module_name
        data_tests: [not_null]
