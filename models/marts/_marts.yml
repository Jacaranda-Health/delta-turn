version: 2

models:
  - name: delta_kpis_daily
    description: Daily DELTA KPIs for Power BI (enrolled, success, downtime, latency).
    columns:
      - name: day
        data_tests: [not_null, unique]
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique
  - name: module_completion_daily
    description: >
      Daily module completion per canonical module. A contact completes a module
      when they complete ALL of the module's active lessons (roll-up of
      mini_module_completion).
    columns:
      - name: module_name
        data_tests: [not_null]
      - name: day
        data_tests: [not_null]
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique

  - name: mini_module_completion_daily
    description: >
      Daily lesson (mini-module) completion per canonical lesson. Lesson completion =
      answered all of that lesson's questions. Canonical names from mini_module_map.
    columns:
      - name: module_name
        data_tests: [not_null]
      - name: mini_module
        data_tests: [not_null]
      - name: day
        data_tests: [not_null]
      - name: id
        description: Surrogate key (dbt_utils.generate_surrogate_key over the grain).
        data_tests:
          - not_null
          - unique

  - name: session_latency
    description: >
      Session-grain latency (one row per replied trigger, no user identifiers).
      Exists so Power BI can compute a true MEDIAN/percentile over any selected
      period — averaging daily medians is not statistically valid.
    columns:
      - name: day
        description: Date of the inbound trigger.
        data_tests: [not_null]
      - name: latency_seconds
        description: Seconds from user trigger to DELTA's first reply, bounded by max_reply_window_seconds.
        data_tests: [not_null]
      - name: id
        description: Surrogate key of (day, latency_seconds).
        data_tests:
          - not_null
          - unique
  - name: module_progression_daily
    description: >
      Distribution of contacts by number of lessons completed within a module.
    columns:
      - name: module_name
        data_tests: [not_null]
      - name: lessons_completed
        data_tests: [not_null]
      - name: id
        description: Surrogate key of (module_name, lessons_completed).
        data_tests:
          - not_null
          - unique
